kind = "web"
previewPath = "/"
title = "AA MD Bot Dashboard"
version = "1.0.0"
id = "artifacts/aa-md-bot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19724

[services.development]
run = "pnpm --filter @workspace/aa-md-bot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aa-md-bot", "run", "build" ]
publicDir = "artifacts/aa-md-bot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19724"
BASE_PATH = "/"
