<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AA MD Bot — Server</title>
    <meta name="theme-color" content="#25d366" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #060911;
        color: #dde6f4;
        font-family: 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 24px;
      }
      .logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 2px solid #25d366;
        box-shadow: 0 0 24px rgba(37,211,102,0.3);
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        color: #fff;
      }
      h1 span { color: #25d366; }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        color: #6b7f99;
        background: #0d1421;
        border: 1px solid #182030;
        border-radius: 999px;
        padding: 6px 16px;
      }
      .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #25d366;
        box-shadow: 0 0 6px #25d366;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #25d366;
        color: #000;
        font-weight: 700;
        font-size: 1rem;
        padding: 14px 32px;
        border-radius: 12px;
        text-decoration: none;
        transition: transform 0.15s, box-shadow 0.15s;
        box-shadow: 0 4px 20px rgba(37,211,102,0.35);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(37,211,102,0.5);
      }
      .btn svg { width: 20px; height: 20px; }
      .note {
        font-size: 0.78rem;
        color: #3d4f65;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <img src="/logo.webp" class="logo" alt="AA MD Bot" onerror="this.style.display='none'" />
    <h1>AA MD <span>Bot</span></h1>
    <div class="status">
      <div class="dot"></div>
      <span id="statusText">Server online</span>
    </div>
    <a href="https://aa-md-bot.vercel.app/" target="_blank" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Open Dashboard
    </a>
    <p class="note">Bot API is running. Manage sessions at the link above.</p>

    <script>
      fetch('/api/status')
        .then(r => r.json())
        .then(d => {
          const el = document.getElementById('statusText');
          const count = d.sessions ? Object.keys(d.sessions).length : 0;
          el.textContent = `Server online · ${count} session${count !== 1 ? 's' : ''} active`;
        })
        .catch(() => {});
    </script>
  </body>
</html>
