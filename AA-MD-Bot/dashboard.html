<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AA MD Bot — Server</title>
    <meta name="theme-color" content="#25d366" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #060911;
        color: #dde6f4;
        font-family: 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 24px;
      }
      .logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 2px solid #25d366;
        box-shadow: 0 0 24px rgba(37,211,102,0.3);
      }
      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        color: #fff;
      }
      h1 span { color: #25d366; }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        color: #6b7f99;
        background: #0d1421;
        border: 1px solid #182030;
        border-radius: 999px;
        padding: 6px 16px;
      }
      .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #25d366;
        box-shadow: 0 0 6px #25d366;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #25d366;
        color: #000;
        font-weight: 700;
        font-size: 1rem;
        padding: 14px 32px;
        border-radius: 12px;
        text-decoration: none;
        transition: transform 0.15s, box-shadow 0.15s;
        box-shadow: 0 4px 20px rgba(37,211,102,0.35);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(37,211,102,0.5);
      }
      .btn svg { width: 20px; height: 20px; }
      .about {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 340px;
      }
      .about-item {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #0d1421;
        border: 1px solid #182030;
        border-radius: 12px;
        padding: 12px 16px;
      }
      .about-item svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      .about-item > div {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .label {
        font-size: 0.72rem;
        color: #3d4f65;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .value {
        font-size: 0.92rem;
        color: #dde6f4;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="/logo.webp" class="logo" alt="AA MD Bot" onerror="this.style.display='none'" />
    <h1>AA MD <span>Bot</span></h1>
    <a href="https://aa-md-bot.vercel.app/" target="_blank" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Open Dashboard
    </a>

    <div class="about">
      <div class="about-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#25d366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <div>
          <span class="label">Version</span>
          <span class="value">v3.0.0</span>
        </div>
      </div>
      <div class="about-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#25d366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <div>
          <span class="label">Developer</span>
          <span class="value">Ahsan Ali Wadani</span>
        </div>
      </div>
      <div class="about-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#25d366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <div>
          <span class="label">Brand</span>
          <span class="value">AA Mods</span>
        </div>
      </div>
      <div class="about-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#25d366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <div>
          <span class="label">Platform</span>
          <span class="value">Multi-Device WhatsApp</span>
        </div>
      </div>
      <div class="about-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#25d366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <div>
          <span class="label">Plugins</span>
          <span class="value">198+ Commands</span>
        </div>
      </div>
      <div class="about-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="#25d366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        <div>
          <span class="label">Database</span>
          <span class="value">Firebase Realtime DB</span>
        </div>
      </div>
    </div>
  </body>
</html>
